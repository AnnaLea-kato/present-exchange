<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>プレゼント交換決め用</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#b3122b;--deep:#8c0d21;--ink:#2a1015;--sub:#7a5a60;--line:#d9c4c8;--card:#fff;--snow:#fff7f7;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6;
background-color:var(--red);
background-image:radial-gradient(circle at 12px 12px,rgba(255,255,255,.6) 2.2px,transparent 3.2px),radial-gradient(circle at 46px 40px,rgba(255,255,255,.38) 1.6px,transparent 2.6px),radial-gradient(circle at 70px 8px,rgba(255,255,255,.28) 1.2px,transparent 2.2px);
background-size:64px 64px,96px 96px,128px 128px}
main{max-width:640px;margin:0 auto;padding:20px 14px 48px}
h1{font-size:28px;font-weight:900;margin:4px 0 2px;color:#fff;letter-spacing:.03em;text-shadow:0 2px 0 var(--deep)}
.lead{margin:0 0 14px;color:#ffe3e6;font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 3px 0 var(--deep)}
.cane{height:12px;border-radius:16px 16px 0 0;margin:-14px -14px 10px;background:repeating-linear-gradient(135deg,#fff 0 10px,var(--red) 10px 20px)}
.now{margin-bottom:6px;font-weight:700;font-size:15px;min-height:30px}
svg{display:block;width:100%;height:auto}
.en{cursor:default}.en.me{cursor:pointer}
.en.me:focus-visible circle{stroke-width:6}
#res{margin:14px 0;padding:14px 16px;font-size:17px;font-weight:700;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#res b{font-size:22px;font-weight:900}
input{font:inherit;color:var(--ink);width:100%;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--snow)}
button{font:inherit;padding:10px 18px;border-radius:999px;border:2px solid var(--red);background:var(--red);color:#fff;font-weight:700;cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(60,0,10,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
#modal.on{display:flex}
#modal .card{width:100%;max-width:360px;padding:22px 20px}
#modal h3{margin:0 0 4px;font-size:20px;font-weight:900;color:var(--red)}
#modal p{margin:0 0 12px;font-size:14px;color:var(--sub)}
#err{color:#c92a2a;font-size:13px;font-weight:700;min-height:20px;margin:6px 0}
#modal button{width:100%}
</style>
</head>
<body>
<main>
<h1>プレゼント交換決め用</h1>
<p class="lead">名前を入力すると、あなたの番号が決まります。その番号をタップして、あみだくじをたどってください。</p>
<div class="card">
  <div class="cane"></div>
  <div class="now" id="now"></div>
  <div id="wrap"></div>
</div>
<div id="res" class="card">名前を入力してください</div>
</main>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="card">
    <h3 id="mt">お名前は？</h3>
    <p>入力すると、あなたの番号が決まります。</p>
    <input id="nm" list="nl" placeholder="名前を入力" autocomplete="off" maxlength="20">
    <datalist id="nl"></datalist>
    <div id="err"></div>
    <button id="go">はじめる</button>
  </div>
</div>

<script>
const N=8,ROWS=14,CW=72,PX=40,TOP=64,H=420,BOT=TOP+H,W=PX*2+(N-1)*CW,HH=BOT+64;
const NAMES=['ビオン','絵里','こうせい','モナ','アンナ','ダニエル','デイビッド','ゆい'];
const RUNGS=[[0,2,4],[0,2,4,6],[0,2,5],[0,4,6],[1,4,6],[0,2,4,6],[0,2,5],[2,4,6],[0,2,4,6],[0,3,6],[0,3,5],[0,2,4,6],[0,3,6],[1,4,6]];
const COLS=['#c8102e','#1b7f4b','#e0a100','#1d4e89','#8e2a8b','#00838f','#d9480f','#5f3dc4'];
let cur=null,done=false,anim=false,busy=false;
const $=id=>document.getElementById(id),res=$('res'),modal=$('modal'),nm=$('nm'),err=$('err');
const X=i=>PX+i*CW,Y=k=>TOP+30+k*(H-60)/(ROWS-1),col=s=>COLS[s%COLS.length];
const norm=s=>String(s).normalize('NFKC').replace(/\s/g,'').replace(/さん$/,'').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
const esc=t=>String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function trace(s){let c=s;const pts=[[X(c),TOP]];for(let k=0;k<ROWS;k++){const row=RUNGS[k];let d=0;if(row.includes(c))d=1;else if(row.includes(c-1))d=-1;if(d){pts.push([X(c),Y(k)]);c+=d;pts.push([X(c),Y(k)])}}pts.push([X(c),BOT]);return{pts,end:c}}
function render(){
  const t=cur!==null?trace(cur):null;
  let h=`<svg viewBox="0 0 ${W} ${HH}" role="img" aria-label="あみだくじ">`;
  for(let i=0;i<N;i++)h+=`<line x1="${X(i)}" y1="${TOP}" x2="${X(i)}" y2="${BOT}" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>`;
  RUNGS.forEach((row,k)=>row.forEach(i=>{h+=`<line x1="${X(i)}" y1="${Y(k)}" x2="${X(i+1)}" y2="${Y(k)}" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>`}));
  if(t&&done)h+=`<polyline class="${anim?'anim':''}" points="${t.pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="${col(cur)}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`;
  for(let i=0;i<N;i++){const me=i===cur,on=me&&done;
    h+=`<g class="en${me&&!done?' me':''}" data-s="${i}" ${me&&!done?'tabindex="0" role="button"':''} aria-label="入口${i+1}"><circle cx="${X(i)}" cy="${TOP-28}" r="19" fill="${on?col(i):me?'#b3122b':'#fff'}" stroke="${me?(on?col(i):'#b3122b'):'#d9c4c8'}" stroke-width="${me&&!done?5:3}"/><text x="${X(i)}" y="${TOP-28}" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="900" fill="${me?'#fff':'#9a8388'}">${i+1}</text></g>`}
  for(let e=0;e<N;e++){const show=t&&done&&!anim&&e===t.end,nx=NAMES[e],fs=nx.length<=3?15:nx.length===4?13:11;
    h+=`<rect x="${X(e)-31}" y="${BOT+10}" width="62" height="42" rx="10" fill="${show?col(cur):'#fff7f7'}" stroke="${show?col(cur):'#d9c4c8'}" stroke-width="2.5"/><text x="${X(e)}" y="${BOT+31}" text-anchor="middle" dominant-baseline="central" font-size="${show?fs:18}" font-weight="900" fill="${show?'#fff':'#7a5a60'}">${show?esc(nx):'？'}</text>`}
  $('wrap').innerHTML=h+'</svg>';
  const pl=document.querySelector('polyline.anim');
  if(pl){const L=pl.getTotalLength();pl.style.strokeDasharray=L;pl.style.strokeDashoffset=L;pl.getBoundingClientRect();pl.style.transition='stroke-dashoffset 1.4s ease-in-out';pl.style.strokeDashoffset=0}
  $('now').innerHTML=cur!==null?`<span style="color:var(--red)">${esc(NAMES[cur])}</span>さん`:'';
}
function openModal(){nm.value='';err.textContent='';cur=null;done=false;render();modal.classList.add('on');res.innerHTML='<span>名前を入力してください</span>';setTimeout(()=>nm.focus(),50)}
function start(){
  const v=norm(nm.value);
  if(!v){err.textContent='名前を入力してください';return}
  const i=NAMES.findIndex(n=>norm(n)===v);
  if(i<0){err.textContent='リストにない名前です。もう一度入力してください';return}
  cur=i;done=false;modal.classList.remove('on');render();
  res.innerHTML=`<span>${esc(NAMES[i])}さんは <b style="color:var(--red)">${i+1}番</b> です。タップしてください</span>`;
}
$('go').onclick=start;
nm.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)start()});
function pick(s){
  if(busy||done||s!==cur)return;
  busy=true;done=true;anim=true;render();
  setTimeout(()=>{busy=false;anim=false;render();
    res.innerHTML=`<span>${esc(NAMES[cur])}さん → <b style="margin-left:8px;color:${col(cur)}">${esc(NAMES[trace(cur).end])}さん</b></span><button id="next">次の人へ</button>`;
    $('next').onclick=openModal},1450);
}
$('wrap').addEventListener('click',e=>{const g=e.target.closest('[data-s]');if(g)pick(+g.dataset.s)});
$('wrap').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const g=e.target.closest('[data-s]');if(g){e.preventDefault();pick(+g.dataset.s)}}});
$('nl').innerHTML=NAMES.map(n=>`<option value="${esc(n)}">`).join('');
openModal();
</script>
</body>
</html>
